name: Build unsigned iOS IPA

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "device.css"
      - "src/**"
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Prepare bundled game files
        run: bash ios/prepare-web.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/OneRoom/project.yml --project ios/OneRoom

      - name: Build for iPhone and iPad
        run: >-
          xcodebuild
          -project ios/OneRoom/OneRoom.xcodeproj
          -scheme OneRoom
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package unsigned IPA
        shell: bash
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/OneRoom.app build/ipa/Payload/OneRoom.app
          cd build/ipa
          zip -qr OneRoom-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneRoom-unsigned-IPA
          path: build/ipa/OneRoom-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
